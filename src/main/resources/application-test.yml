server:
  port: 80

spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            maxAge: 3600
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: http://auth-service.auth-service.svc.cluster.local:8080
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<path>.*), /$\{path}

        - id: chat-service
          uri: http://chat-service.chat-service.svc.cluster.local:8080
          predicates:
            - Path=/chat/**
          filters:
            - RewritePath=/chat/(?<path>.*), /$\{path}

        - id: club-service
          uri: http://club-service.club-service.svc.cluster.local:8080
          predicates:
            - Path=/club/**
          filters:
            - RewritePath=/club/(?<path>.*), /$\{path}

        - id: club-service-graphql
          uri: http://club-service.club-service.svc.cluster.local:8080
          predicates:
            - Path=/graphql/**
          filters:
            - RewritePath=/graphql/(?<segment>.*), /graphql/$\{segment}

        - id: club-service-graphiql
          uri: http://club-service.club-service.svc.cluster.local:8080
          predicates:
            - Path=/graphiql/**
          filters:
            - RewritePath=/graphiql/(?<path>.*), /graphiql/$\{path}

        - id: matcher-service
          uri: http://matcher-service.matcher-service.svc.cluster.local:8080
          predicates:
            - Path=/matcher/**
          filters:
            - RewritePath=/matcher/(?<path>.*), /$\{path}

        - id: twitter-service
          uri: http://twitter-service.twitter-service.svc.cluster.local:8080
          predicates:
            - Path=/twitter/**
          filters:
            - RewritePath=/twitter/(?<path>.*), /$\{path}